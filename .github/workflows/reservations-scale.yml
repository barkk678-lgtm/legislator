name: הסתייגויות - בדיקת קריאת PDF בקנה מידה

# ידני בלבד (הסתייגויות 1, 26.9). מוריד לאט מדגם של נוסחים לקריאה שנייה
# ושלישית מ-fs.knesset.gov.il ומריץ tools/reservations_quote_check.py.
# המדגם נשאר בתיקייה הזמנית של ה-runner - לא נכנס לריפו. התוצאות: בלוג,
# ובקובץ JSON שנשמר כ-artifact לשבוע.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "גודל המדגם"
        default: "60"
      delay:
        description: "שניות בין הורדות"
        default: "8"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: מדגם ומדידה
        run: |
          python3 tools/reservations_scale_sample.py --n "${{ inputs.n }}" --delay "${{ inputs.delay }}" \
            --work "$RUNNER_TEMP/sample" --out "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reservations-scale-results
          path: ${{ runner.temp }}/results.json
          retention-days: 7
