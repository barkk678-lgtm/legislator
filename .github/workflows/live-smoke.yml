# בדיקות "כמו לקוח" מול האתר החי.
#
# **למה בנפרד מ-tests.yml:** שם בודקים שהקוד נכון, כאן שהאתר
# שפרוס **עכשיו** עובד. השניים נכשלים מסיבות שונות - בדיקת יחידה
# נשברת מקוד, בדיקה חיה נשברת מפריסה שלא עלתה, ממשתנה סביבה חסר
# ב-Vercel, מ-Supabase שנפל, או מקוד שנכתב ומעולם לא נדחף.
#
# **זה לא תיאורטי:** בהרצה הראשונה שלה (22.9.2026) הבדיקה מצאה
# ש-14 קומיטים של לילה שלם ישבו מקומית ולא הגיעו לפרודקשן. כל
# בדיקות היחידה עברו, והאתר החי הריץ את הקוד של אתמול.
#
# **עלות:** ברירת המחדל חינמית לגמרי. הריצה היומית מוסיפה
# `--with-llm`, שכולל את כלי הצ'אט - שם כל קריאה עולה כסף.
name: בדיקות מול האתר החי

on:
  # **אחרי כל פריסה, לא רק לפי לוח זמנים** (ברק, 22.9.2026):
  # "כך היא תופסת פריסה שבורה תוך דקות, לא למחרת."
  #
  # `deployment_status` הוא האירוע שמגיע מ-Vercel עצמו כשהפריסה
  # דיווחה על מצבה. הוא עדיף על `push` כי הוא יורה כשהאתר **כבר
  # חי**, ולא כשהקוד נדחף - כלומר בלי ניחוש של כמה זמן לחכות,
  # ובלי לבדוק בטעות את הגרסה הקודמת.
  deployment_status:
  schedule:
    - cron: "30 5 * * *"   # אחרי העדכון היומי של הקורפוס (04:00)
  workflow_dispatch:
    inputs:
      with_llm:
        description: "לכלול גם את כלי הצ'אט (עולה כסף)"
        type: boolean
        default: false
  # רשת ביטחון: אם ה-webhook של הפריסה אינו מגיע משום סיבה,
  # push ל-master עדיין מפעיל בדיקה (עם המתנה, ראו למטה).
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # פריסה שנכשלה או עדיין רצה - אין מה לבדוק מולה.
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # **המתנה לפריסה.** push ל-master מפעיל פריסה ב-Vercel,
      # והבדיקה שתרוץ מיד תיבדק מול הגרסה הקודמת ותדווח כשל שווא -
      # או גרוע יותר, תעבור ותסתיר בעיה אמיתית.
      # רק במסלול ה-push. ב-deployment_status האתר כבר חי, ואין
      # מה לחכות לו.
      - name: המתנה לפריסת Vercel
        if: github.event_name == 'push'
        run: sleep 120

      - name: בדיקות כמו לקוח
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.with_llm }}" = "true" ]; then
            EXTRA="--with-llm"
          fi
          python3 tests/live_smoke.py $EXTRA
